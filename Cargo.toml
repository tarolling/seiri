[package]
authors = ["tarolling"]
description = "A tool to visualize and explore the structure of your codebase."
edition = "2024"
homepage = "https://github.com/tarolling/seiri/"
license = "MIT"
name = "seiri-cli"
readme = "README.md"
repository = "https://github.com/tarolling/seiri/"
version = "0.4.3"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "cargo"] }
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "wayland",
    "web_screen_reader",
    "wgpu_no_default_features",
    "x11",
] }
egui = "0.36.2"
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "gles",
    "wgsl",
] }
fontdue = "0.9.4"
font-kit = "0.14.3"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
indicatif = "0.18.6"
petgraph = "0.8.3"
rayon = "1.12.0"
self_update = { version = "1.3.0", default-features = false, features = [
    "reqwest",
    "native-tls",
    "github",
    "progress-bar",
    "archive-tar",
    "compression-tar-gz",
    "archive-zip",
    "compression-zip-deflate",
] }
svg = "0.18.0"
tiny-skia = "0.12.0"
tree-sitter = "0.27.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"

# Sequential-vs-parallel parsing comparison per supported language.
[[bench]]
harness = false
name = "parsing"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
